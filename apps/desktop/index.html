<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101112" />
    <link rel="icon" href="data:," />
    <title>Nexious Tunnel</title>
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      body{font-family:"Microsoft YaHei","Segoe UI",sans-serif;overflow:hidden;--splash-accent:#ef4444;--splash-rgb:239,68,68;--splash-bg:#101112}
      /* 与应用内风格预设保持一致（见 src/theme.ts），由 theme-boot.js 在首帧前写入 data-accent */
      body[data-accent="claw"]{--splash-accent:#e5484d;--splash-rgb:229,72,77;--splash-bg:#0d0e0f}
      body[data-accent="knot"]{--splash-accent:#818cf8;--splash-rgb:129,140,248;--splash-bg:#101014}
      body[data-accent="dash"]{--splash-accent:#22c9dd;--splash-rgb:34,201,221;--splash-bg:#0e1214}
      body[data-accent="forest"]{--splash-accent:#3fb970;--splash-rgb:63,185,112;--splash-bg:#0f1211}
      body[data-accent="slate"]{--splash-accent:#7f95ad;--splash-rgb:127,149,173;--splash-bg:#12161d}
      body[data-accent="paper"]{--splash-accent:#cf9264;--splash-rgb:207,146,100;--splash-bg:#121110}
      body[data-accent="amber"]{--splash-accent:#f5a623;--splash-rgb:245,166,35;--splash-bg:#11100c}
      body.light[data-accent="claw"]{--splash-accent:#b42318;--splash-rgb:180,35,24;--splash-bg:#f5f5f6}
      body.light[data-accent="knot"]{--splash-accent:#4f46e5;--splash-rgb:79,70,229;--splash-bg:#f5f5f8}
      body.light[data-accent="dash"]{--splash-accent:#0d8aa2;--splash-rgb:13,138,162;--splash-bg:#f4f7f8}
      body.light[data-accent="forest"]{--splash-accent:#15803d;--splash-rgb:21,128,61;--splash-bg:#f4f7f5}
      body.light[data-accent="slate"]{--splash-accent:#4d6a85;--splash-rgb:77,106,133;--splash-bg:#f3f5f7}
      body.light[data-accent="paper"]{--splash-accent:#9a5f33;--splash-rgb:154,95,51;--splash-bg:#faf8f4}
      body.light[data-accent="amber"]{--splash-accent:#b45309;--splash-rgb:180,83,9;--splash-bg:#faf7f0}
      /* ── Dark (default) ── */
      body{background:var(--splash-bg)}
      #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:var(--splash-bg);z-index:9999;transition:opacity .4s ease}
      #splash.fade-out{opacity:0;pointer-events:none}
      .splash-logo{width:48px;height:48px;border:1.5px solid var(--splash-accent);border-radius:8px;display:grid;place-items:center;color:var(--splash-accent);animation:splashPulse 2s ease-in-out infinite}
      .splash-logo svg{width:24px;height:24px}
      .splash-text{color:#8b9391;font-size:12px;letter-spacing:1.5px;font-family:Consolas,"Courier New",monospace}
      .splash-bar{width:120px;height:2px;background:#272a2c;border-radius:1px;overflow:hidden}
      .splash-bar-inner{width:40%;height:100%;background:var(--splash-accent);border-radius:1px;animation:splashSlide 1.2s ease-in-out infinite}
      @keyframes splashPulse{0%,100%{box-shadow:0 0 0 0 rgba(var(--splash-rgb),0)}50%{box-shadow:0 0 0 8px rgba(var(--splash-rgb),.1)}}
      @keyframes splashSlide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
      /* ── Light theme override ── */
      body.light{background:var(--splash-bg)}
      body.light #splash{background:var(--splash-bg)}
      body.light .splash-text{color:#666e6b}
      body.light .splash-bar{background:#e2e6e5}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash">
      <div class="splash-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div class="splash-text">NEXIOUS TUNNEL</div>
      <div class="splash-bar"><div class="splash-bar-inner"></div></div>
    </div>
    <!-- 引导脚本放在独立文件中，避免内联脚本被 CSP 拦截（见 public/theme-boot.js） -->
    <script src="/theme-boot.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
